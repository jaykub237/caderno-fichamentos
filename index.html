<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Caderno de fichamentos</title>
<style>
:root{
  --paper:#F0EFEA; --surface:#FBFAF7; --surface-2:#E8E7E0; --ink:#1A2326;
  --ink-soft:#5C6A6D; --ink-faint:#8A9496; --rule:#D3D2CA; --rule-hard:#B8B7AE;
  --accent:#275E63; --accent-bg:#DDE6E5; --pen:#9A3B2E; --pen-bg:#EFE0DC;
  --agree:#3E7A5E; --agree-bg:#DFE9E2; --warn:#8A6A1E; --warn-bg:#F0E7D2;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#14191B; --surface:#1B2225; --surface-2:#232B2E; --ink:#E4E4DE;
  --ink-soft:#9AA6A8; --ink-faint:#6B777A; --rule:#2E393C; --rule-hard:#3E4B4E;
  --accent:#77B7B7; --accent-bg:#1E3134; --pen:#DB8570; --pen-bg:#33231F;
  --agree:#78B294; --agree-bg:#1D2C25; --warn:#D6B15E; --warn-bg:#2B2415;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}

/* ---- topbar ---- */
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--rule-hard)}
.top-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.btn{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--accent);border:1px solid var(--accent);padding:8px 14px;cursor:pointer;border-radius:2px}
button.btn:hover{background:var(--accent-bg)}
button.btn.solid{background:var(--accent);color:var(--surface)}
button.btn.solid:hover{opacity:.88}
button.btn.quiet{border-color:var(--rule-hard);color:var(--ink-soft)}
button.btn.quiet:hover{background:var(--surface-2)}
button.btn.danger{border-color:var(--pen);color:var(--pen)}
button.btn.danger:hover{background:var(--pen-bg)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);display:inline-block;flex-shrink:0}
.dot.ok{background:var(--agree)} .dot.dirty{background:var(--warn)} .dot.err{background:var(--pen)}
.syncmsg{font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:7px}

/* ---- tabs ---- */
nav.tabs{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;gap:2px;border-bottom:1px solid var(--rule);
  overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:12px 16px;cursor:pointer;
  white-space:nowrap;flex-shrink:0;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}

/* ---- filtros ---- */
.filters{background:var(--surface-2);border-bottom:1px solid var(--rule-hard)}
.filters-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup>span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:4px 9px;border:1px solid var(--rule-hard);
  color:var(--ink-soft);background:var(--surface);cursor:pointer;border-radius:2px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:600}
input.search{background:var(--surface);border:1px solid var(--rule-hard);padding:7px 11px;min-width:230px;border-radius:2px;font-size:14px}
.fcount{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft);align-self:center}

main{max-width:1400px;margin:0 auto;padding:26px 20px 100px}
.pane[hidden]{display:none}
h2.sec{font-size:20px;font-weight:600;margin:34px 0 6px;letter-spacing:-.01em}
h2.sec:first-child{margin-top:0}
p.hint{color:var(--ink-soft);font-size:14.5px;max-width:76ch;margin-bottom:16px}

/* ---- matriz ---- */
.scroller{overflow-x:auto;border:1px solid var(--rule-hard);background:var(--surface)}
table.matrix{border-collapse:collapse;width:100%;font-size:14px}
table.matrix th,table.matrix td{text-align:left;vertical-align:top;padding:11px 15px;border-bottom:1px solid var(--rule)}
table.matrix thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);border-bottom:2px solid var(--ink);
  font-family:var(--sans);font-size:12.5px;font-weight:600;line-height:1.35;min-width:210px}
table.matrix thead th .who{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
table.matrix th.axis{position:sticky;left:0;z-index:2;background:var(--surface-2);width:160px;min-width:160px;
  border-right:1px solid var(--rule-hard);font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:400;line-height:1.5}
table.matrix thead th:first-child{z-index:4}
table.matrix tbody tr:hover td{background:var(--accent-bg)}
table.matrix td.vazio{color:var(--ink-faint)}

/* ---- fichas ---- */
.ficha{border:1px solid var(--rule-hard);background:var(--surface);margin-bottom:26px;scroll-margin-top:130px}
.ficha>header{padding:20px 24px 18px;border-bottom:2px solid var(--ink);background:var(--surface-2);
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.ficha>header .h{flex:1 1 420px;min-width:0}
.ficha>header h3{font-size:19px;font-weight:600;margin:6px 0 8px;letter-spacing:-.01em}
.ficha .ref{font-size:14px;color:var(--ink-soft)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 8px;border:1px solid var(--rule-hard);color:var(--ink-soft)}
.badge.key{border-color:var(--accent);color:var(--accent)}
.badge.pre{border-color:var(--pen);color:var(--pen)}
.rows{padding:2px 24px 22px}
.row{display:grid;gap:4px 20px;padding:15px 0;border-bottom:1px solid var(--rule)}
@media(min-width:820px){.row{grid-template-columns:190px 1fr}}
.row:last-child{border-bottom:none}
.row>.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding-top:4px}
.row>.lbl b{display:block;color:var(--accent);font-weight:400;margin-bottom:3px}
.row>.val{font-size:15.5px;min-width:0}
.row>.val p+p{margin-top:9px}
.row>.val ul{list-style:none;display:grid;gap:7px;margin-top:2px}
.row>.val li{padding-left:16px;position:relative}
.row>.val li::before{content:"—";position:absolute;left:0;color:var(--ink-faint)}
.row.mine{background:linear-gradient(90deg,var(--pen-bg),transparent 62%);margin:0 -24px;padding-left:24px;padding-right:24px}
.row.mine>.lbl b{color:var(--pen)}
p.todo{color:var(--pen);font-style:italic}
code{font-family:var(--mono);font-size:13px;background:var(--surface-2);padding:1px 4px;border-radius:2px}
a.xref{font-family:var(--mono);font-size:13.5px;text-decoration:none;border-bottom:1px solid var(--accent)}

/* ---- edição ---- */
.edit-grid{display:grid;gap:10px 16px;padding:18px 24px;background:var(--accent-bg);border-bottom:1px solid var(--rule-hard)}
@media(min-width:760px){.edit-grid{grid-template-columns:repeat(3,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.field input,.field textarea{background:var(--surface);border:1px solid var(--rule-hard);padding:6px 9px;border-radius:2px;font-size:14px;width:100%}
.row textarea{background:var(--surface);border:1px solid var(--rule-hard);padding:9px 11px;border-radius:2px;
  font-family:var(--mono);font-size:13px;line-height:1.6;width:100%;min-height:90px;resize:vertical}
.edit-bar{display:flex;gap:8px;padding:12px 24px;background:var(--accent-bg);border-bottom:1px solid var(--rule-hard);align-items:center;flex-wrap:wrap}
.edit-bar .note{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-left:auto}

/* ---- análise ---- */
.grid2{display:grid;gap:1px;background:var(--rule-hard);border:1px solid var(--rule-hard)}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.grid2>div{background:var(--surface);padding:20px 22px 24px}
.card{border:1px solid var(--rule-hard);background:var(--surface);padding:20px 22px 24px;margin-bottom:18px}
.card h3{font-family:var(--sans);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;color:var(--accent)}
.card h4{font-size:15px;font-weight:600;margin:16px 0 6px}
.card h4:first-of-type{margin-top:0}
.lista{list-style:none;display:grid;gap:7px;font-size:14.5px}
.lista li{padding-left:16px;position:relative;line-height:1.5}
.lista li::before{content:"·";position:absolute;left:2px;color:var(--ink-faint)}
.tag-iso{color:var(--pen);font-family:var(--mono);font-size:10px;letter-spacing:.08em}
.tag-uni{color:var(--agree);font-family:var(--mono);font-size:10px;letter-spacing:.08em}
.verdict{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;margin-top:8px}
.v-tensao{background:var(--pen-bg);color:var(--pen)}
.v-padrao{background:var(--accent-bg);color:var(--accent)}
.v-indep{background:var(--agree-bg);color:var(--agree)}
.v-cita{background:var(--warn-bg);color:var(--warn)}
table.cross{border-collapse:collapse;width:100%;font-size:13px;font-family:var(--mono)}
table.cross th,table.cross td{border:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
table.cross th{background:var(--surface-2);font-weight:400;color:var(--ink-soft);font-size:11px;letter-spacing:.06em}
table.cross td.empty{background:var(--pen-bg);color:var(--pen);text-align:center}
.par{border-bottom:1px solid var(--rule);padding:14px 0}
.par:last-child{border-bottom:none}
.par b{font-family:var(--mono);font-size:13px}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal[hidden]{display:none}
.modal-box{background:var(--surface);border:1px solid var(--rule-hard);max-width:720px;width:100%;padding:26px 28px 28px}
.modal-box h3{font-size:19px;font-weight:600;margin-bottom:8px}
.modal-box p{color:var(--ink-soft);font-size:14.5px;margin-bottom:16px}
.modal-box textarea{width:100%;min-height:190px;font-family:var(--mono);font-size:12.5px;line-height:1.55;
  background:var(--paper);border:1px solid var(--rule-hard);padding:11px;border-radius:2px;resize:vertical}
.modal-box .field{margin-bottom:14px}
.modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.modal-actions .spacer{margin-left:auto}
.msg{font-family:var(--mono);font-size:11.5px;padding:9px 12px;border-radius:2px;margin-top:14px}
.msg.ok{background:var(--agree-bg);color:var(--agree)}
.msg.err{background:var(--pen-bg);color:var(--pen)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.empty-state{border:1px dashed var(--rule-hard);padding:40px 28px;text-align:center;color:var(--ink-soft)}
.empty-state h3{font-size:18px;color:var(--ink);margin-bottom:8px}

/* ---- recolher ---- */
button.toggle{background:none;border:1px solid var(--rule-hard);color:var(--ink-soft);cursor:pointer;
  width:26px;height:26px;border-radius:2px;font-family:var(--mono);font-size:13px;line-height:1;flex-shrink:0}
button.toggle:hover{background:var(--surface-2);color:var(--accent);border-color:var(--accent)}
.ficha.recolhida .rows{display:none}
.ficha.recolhida>header{border-bottom:1px solid var(--rule-hard)}
.resumo{display:none;font-size:14px;color:var(--ink-soft);margin-top:10px;line-height:1.5}
.ficha.recolhida .resumo{display:block}
.barra-ferramentas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.barra-ferramentas .nota{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:auto}
.barra-ferramentas .ordem{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.barra-ferramentas select{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule-hard);border-radius:2px;padding:4px 6px}
.nficha{color:var(--ink);font-weight:700;letter-spacing:.06em;margin-right:8px}
table.matrix .nficha{display:block;margin:0 0 2px}
.card.recolhida .card-corpo{display:none}
.card>h3{display:flex;align-items:center;gap:10px}
.card>h3 .toggle{margin-left:auto}

/* ---- índice ---- */
.indice{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:60;background:var(--surface);
  border-left:1px solid var(--rule-hard);box-shadow:-8px 0 28px rgba(0,0,0,.18);display:flex;flex-direction:column}
.indice[hidden]{display:none}
.indice>header{padding:18px 20px 14px;border-bottom:2px solid var(--ink);background:var(--surface-2);
  display:flex;align-items:flex-start;gap:12px}
.indice>header h3{font-size:17px;font-weight:600;flex:1}
.indice .resumo-num{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.indice .corpo{overflow-y:auto;padding:6px 0 40px;flex:1}
.indice .grupo{padding:14px 20px 6px}
.indice .grupo>span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
.indice .grupo.foco>span{color:var(--accent)}
.ix{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--rule);padding:9px 20px;cursor:pointer;color:var(--ink)}
.ix:hover{background:var(--accent-bg)}
.ix.oculta{opacity:.42}
.ix .ano{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex-shrink:0;width:34px}
.ix .num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft);flex-shrink:0;width:28px}
.ix .nome{flex:1;font-size:14.5px;line-height:1.35;min-width:0}
.ix .nome small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:2px}
.ix .st{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:2px 5px;
  border:1px solid var(--rule-hard);color:var(--ink-faint);flex-shrink:0}
.ix .st.completa{border-color:var(--agree);color:var(--agree)}
.ix .st.pre-ficha{border-color:var(--pen);color:var(--pen)}
.backdrop{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35)}
.backdrop[hidden]{display:none}

/* ---- países ---- */
.pais{border:1px solid var(--rule-hard);background:var(--surface);margin-bottom:26px;scroll-margin-top:130px}
.pais.foco{border-left:3px solid var(--accent)}
.pais>header{padding:20px 24px 18px;border-bottom:2px solid var(--ink);background:var(--surface-2);
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.pais>header .h{flex:1 1 380px;min-width:0}
.pais>header h3{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:4px 0 6px}
.pais .sub{font-size:14.5px;color:var(--ink-soft)}
.pais.recolhida .rows{display:none}
.selo{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;
  border-radius:2px;background:var(--accent-bg);color:var(--accent)}
.selo.sec{background:var(--surface);color:var(--ink-faint);border:1px solid var(--rule-hard)}
.fichas-do-pais{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.fichas-do-pais .rot-rel{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin-right:2px}
.fichas-do-pais button{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border:1px solid var(--accent);
  color:var(--accent);background:transparent;cursor:pointer;border-radius:2px}
.fichas-do-pais button:hover{background:var(--accent-bg)}
.fichas-do-pais button.fraca{border-color:var(--rule-hard);color:var(--ink-soft);border-style:dashed}
.fichas-do-pais button.fraca:hover{background:var(--surface-2)}
.chip.foco{border-color:var(--accent);font-weight:600}
.chip.foco::before{content:"★ ";color:var(--accent)}

/* ---- autores ---- */
.autores-grid{display:grid;gap:20px}
@media(min-width:900px){.autores-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1300px){.autores-grid{grid-template-columns:repeat(3,1fr)}}
.autor{border:1px solid var(--rule-hard);background:var(--surface);display:flex;flex-direction:column;scroll-margin-top:130px}
.autor>header{display:flex;gap:16px;padding:18px 20px;border-bottom:2px solid var(--ink);background:var(--surface-2);align-items:flex-start}
.retrato{width:74px;height:74px;flex-shrink:0;border:1px solid var(--rule-hard);background:var(--paper);
  object-fit:cover;display:block;border-radius:2px}
.retrato-vazio{width:74px;height:74px;flex-shrink:0;border:1px dashed var(--rule-hard);background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:19px;
  color:var(--ink-faint);border-radius:2px;letter-spacing:.04em}
.autor>header .quem{flex:1;min-width:0}
.autor>header h3{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:5px;text-wrap:balance}
.autor .onde{font-size:13.5px;color:var(--ink-soft);line-height:1.45}
.autor .acoes{display:flex;gap:6px;flex-shrink:0}
.autor .campos{padding:4px 20px 8px;flex:1}
.autor.recolhida .campos,.autor.recolhida .obs{display:none}
.linha-campo{display:grid;grid-template-columns:104px 1fr;gap:6px 14px;padding:10px 0;border-bottom:1px solid var(--rule)}
.linha-campo:last-child{border-bottom:none}
.linha-campo>dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);padding-top:3px}
.linha-campo>dd{font-size:14.5px;min-width:0;word-break:break-word}
.linha-campo>dd .falta{color:var(--ink-faint);font-style:italic}
.autor .obs{margin:0 20px 18px;padding:14px 16px;background:var(--pen-bg);border-left:3px solid var(--pen)}
.autor .obs>span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--pen);display:block;margin-bottom:7px}
.autor .obs .txt{font-size:14.5px;line-height:1.55}
.autor .obs .txt p+p{margin-top:8px}
.autor .obs textarea{width:100%;min-height:90px;background:var(--surface);border:1px solid var(--rule-hard);
  padding:9px 11px;border-radius:2px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical}
.autor .fichas-do-pais{padding:0 20px 16px;margin-top:0}
.autor-edit{padding:16px 20px;background:var(--accent-bg);border-bottom:1px solid var(--rule-hard);display:grid;gap:10px 14px}
@media(min-width:600px){.autor-edit{grid-template-columns:1fr 1fr}}

<script>
"use strict";

/* ============================================================ constantes */

const K_DADOS = "caderno-fichas-v1";
const K_SYNC  = "caderno-sync";          // separado: o token nunca entra no backup
const K_UI    = "caderno-ui";            // recolhidas: preferência de tela, não vai para o gist
const ARQ     = "caderno.json";

const EIXOS = {
  campo:"Campo", genero:"Gênero", processo:"Processo", metodo:"Método",
  nivel:"Nível", regiao:"Região", caso:"Caso", recorte:"Recorte",
  criterio:"Critério de sucesso", posicao:"Posição", uso:"Uso na tese",
  capitulo:"Capítulo", status:"Status"
};

/* O vocabulário controlado é o aparato analítico da tese, então também mora
   no Gist (campo `vocab`). Sem dados carregados não há datalist — e também
   não há nada para editar. */
function vocab(){ return (estado && estado.vocab) ? estado.vocab : {}; }
const LISTAS = ["regiao","refs","tags","filiacao","autores"];   // campos multivalorados
const META_ORDEM = ["id","autor","autores","ano","titulo","zotero","doi","campo","genero","processo",
  "filiacao","metodo","nivel","regiao","caso","recorte","criterio","posicao","uso","capitulo","status","refs","tags"];

/* Ficha de autor. `autor` continua sendo o texto de exibição da ficha;
   `autores` guarda os ids, porque um artigo pode ter vários. */
const CAMPOS_AUTOR = [
  ["nome",      "nome"],
  ["pais",      "país de origem"],
  ["sede",      "país da instituição"],
  ["afiliacao", "filiação institucional"],
  ["area",      "área e formação"],
  ["email",     "e-mail"],
  ["orcid",     "ORCID ou Lattes"],
  ["link",      "perfil"]
];
const FOTO_LADO = 220;      // px do lado do recorte quadrado
const FOTO_ALERTA = 90000;  // acima disso o dataURI começa a pesar no Gist

const SECOES_PADRAO = [
  ["A1","Referência completa"],["A3","Campo e gênero"],["A4","Palavras-chave"],
  ["B1","Problema e pergunta"],["B2","Argumento central"],["B3","Quadro teórico e filiação"],
  ["B4","Conceitos operacionalizados"],["B5","Interlocutores"],["B6","Pressupostos não demonstrados"],
  ["C1","Método"],["C2","Escopo"],["C3","Corpus e fontes"],["C4","Achados principais"],
  ["C5","Critério de sucesso"],["D1","Contribuição declarada"],["D2","Limitações reconhecidas"],
  ["D3","Minha crítica"],["D4","Posição normativa"],["D5","Uso na tese"],["D6","Diálogo"],
  ["D7","Citações-chave"],["D8","Brecha aberta"]
];
const MINHA_VOZ = ["D3","D5","D6","D8"];
const FILTRAVEIS = ["regiao","status","processo","nivel","criterio","capitulo","uso"];

// Quais países são caso da tese é informação de pesquisa: vem dos dossiês
// carregados do Gist (foco: true), não de uma lista neste arquivo público.
function paisesFoco(){
  return (estado.paises||[]).filter(p => p.foco).map(p => p.id);
}

const SECOES_PAIS = [
  ["P1","Como o debate se deu"],["P2","Cronologia"],["P3","Atores e instituições"],
  ["P4","Documentos-chave"],["P5","Tensões e lacunas"],["P6","O que ainda falta ler"]
];

/* Leituras pendentes: o que ainda falta fichar. A lista é conteúdo e mora no
   Gist (campo `leituras`); daqui só saem os rótulos de status e prioridade. */
const LT_STATUS   = { "a-ler":"a ler", "lendo":"lendo", "descartada":"descartada" };
const LT_PRIOR    = { alta:"alta", media:"média", baixa:"baixa" };
const LT_TIPOS    = { literatura:"literatura", documento:"documento primário" };
const LT_VER      = { pendentes:"pendentes", todas:"todas", fichadas:"já fichadas", descartadas:"descartadas" };
const LT_AGRUPAR  = { grupo:"tema", prioridade:"prioridade", capitulo:"capítulo", tipo:"tipo" };
const LT_MIN_REFS = 3;   // a partir de quantas fichas uma referência vira sugestão automática

/* ================================================================ estado */

let estado = { schema:1, savedAt:null, fichas:[], paises:[], autores:[] };
let cfg    = { gist:"", token:"", seen:null };
let ui     = { recolhidas:[], recolhidasPais:[], recolhidasAutor:[] };
let filtros = { busca:"" };
FILTRAVEIS.forEach(f => filtros[f] = []);
let aba = "matriz";
let editando = null;      // id da ficha em edição
let editandoPais = null;
let editandoAutor = null;
let editandoLt = null;    // id da leitura pendente em edição
let ltRecemCriada = null; // criada agora: Cancelar desfaz a criação, não só a edição
let sujo = false;         // há mudanças locais não enviadas
let leitura = null;       // id da ficha aberta em tela cheia
let leituraEdit = false;  // tela cheia em modo de anotação

/* =============================================================== helpers */

const $  = s => document.querySelector(s);
const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const agora = () => new Date().toISOString();

function campo(f, chave){
  const v = f.meta ? f.meta[chave] : undefined;
  if (v == null || v === "") return "";
  return Array.isArray(v) ? v.join(", ") : String(v);
}
function lista(f, chave){
  const v = f.meta ? f.meta[chave] : undefined;
  if (v == null || v === "") return [];
  return Array.isArray(v) ? v.slice() : String(v).split(",").map(s=>s.trim()).filter(Boolean);
}
function secao(f, cod){
  const s = (f.secoes||[]).find(x => x.codigo === cod);
  return s ? s.corpo : "";
}
function rotulo(f){
  const a = campo(f,"autor") || f.id;
  const primeiro = a.split(",")[0].trim();
  return primeiro + " " + campo(f,"ano");
}
/* Número de entrada: dado uma vez, quando a ficha entra no caderno, e nunca
   recalculado. Renomear o id ou mudar a ordem de exibição não mexe nele, então
   «Nº 07» continua apontando para a mesma ficha em qualquer conversa. */
function numero(f){
  const n = Number(f && f.meta && f.meta.n);
  return Number.isInteger(n) && n > 0 ? n : null;
}
function numFmt(f){
  const n = numero(f);
  return "Nº " + (n ? String(n).padStart(2,"0") : "—");
}
function proximoNumero(){
  return estado.fichas.reduce((m,f) => Math.max(m, numero(f) || 0), 0) + 1;
}
const ORDENS = { n:"nº de entrada", autor:"autor (A–Z)", ano:"ano", id:"id" };
function ordenadas(fs){
  const porN = (a,b) => (numero(a) || 1e9) - (numero(b) || 1e9);
  const cmp = {
    n:     porN,
    autor: (a,b) => rotulo(a).localeCompare(rotulo(b), "pt", {sensitivity:"base"}) || porN(a,b),
    ano:   (a,b) => (campo(a,"ano")||"").localeCompare(campo(b,"ano")||"") || porN(a,b),
    id:    (a,b) => a.id.localeCompare(b.id, "pt")
  }[ORDENS[ui.ordem] ? ui.ordem : "n"];
  return fs.slice().sort(cmp);
}
function pendentes(f){
  return (f.secoes||[]).filter(s => /^\s*>\s*A preencher/i.test(s.corpo||"")).map(s=>s.codigo);
}

/* markdown mínimo — negrito, itálico, código, wikilink, lista, todo */
function md(txt){
  if (!txt) return "";
  let h = esc(txt)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[\[([^\]]+)\]\]/g,'<a href="#f-$1" class="xref" data-jump="$1">$1</a>');
  const out=[]; let emLista=false;
  for (const linha of h.split("\n")){
    const t = linha.trim();
    if (/^[-*]\s+/.test(t)){
      if(!emLista){out.push("<ul>");emLista=true;}
      out.push("<li>"+t.replace(/^[-*]\s+/,"")+"</li>");
    } else if (/^&gt;\s*/.test(t)){
      if(emLista){out.push("</ul>");emLista=false;}
      out.push('<p class="todo">'+t.replace(/^&gt;\s*/,"")+"</p>");
    } else if (t){
      if(emLista){out.push("</ul>");emLista=false;}
      out.push("<p>"+t+"</p>");
    }
  }
  if(emLista) out.push("</ul>");
  return out.join("");
}

/* ============================================================ dossiês de país */
/* Os dossiês são CONTEÚDO e moram no Gist, como as fichas. Este arquivo é
   público: nada de texto de pesquisa aqui dentro. O app só sabe montar a
   estrutura vazia; o que preenche vem do caderno.json. */

function dossieVazio(id, nome){
  return {
    id, nome, foco:false, sub:"", aliases:[nome.toLowerCase()],
    secoes: SECOES_PAIS.map(([codigo,titulo]) => ({ codigo, titulo, corpo:"> A preencher." }))
  };
}
/* =========================================================== persistência */

function salvarLocal(){
  try {
    localStorage.setItem(K_DADOS, JSON.stringify(estado));
  } catch(e){ console.error("localStorage cheio?", e); }
  pintarSync();
}
function carregarLocal(){
  try {
    const d = localStorage.getItem(K_DADOS);
    if (d) estado = JSON.parse(d);
    const c = localStorage.getItem(K_SYNC);
    if (c) cfg = Object.assign(cfg, JSON.parse(c));
    const u = localStorage.getItem(K_UI);
    if (u) ui = Object.assign(ui, JSON.parse(u));
  } catch(e){ console.error("dados locais corrompidos", e); }
  normalizar();
}

/* cadernos gravados antes da aba Países não têm o campo — semear sem apagar nada */
function normalizar(){
  if (!Array.isArray(estado.fichas)) estado.fichas = [];
  if (!Array.isArray(estado.paises)) estado.paises = [];   // vem do Gist, nunca do código
  if (!Array.isArray(estado.autores)) estado.autores = [];
  if (!Array.isArray(estado.leituras)) estado.leituras = [];  // também conteúdo: vem do Gist
  estado.leituras.forEach(l => { if (!Array.isArray(l.indicadaPor)) l.indicadaPor = []; });
  if (!LT_VER[ui.ltVer]) ui.ltVer = "pendentes";
  if (!LT_AGRUPAR[ui.ltAgrupar]) ui.ltAgrupar = "grupo";
  if (!Array.isArray(ui.recolhidas)) ui.recolhidas = [];
  if (!Array.isArray(ui.recolhidasPais)) ui.recolhidasPais = [];
  if (!Array.isArray(ui.recolhidasAutor)) ui.recolhidasAutor = [];
  if (!ORDENS[ui.ordem]) ui.ordem = "n";
  // fichas sem número (cadernos antigos, importação em lote) recebem o próximo,
  // na ordem em que estão no arquivo; Enviar grava o número no gist
  let prox = proximoNumero();
  estado.fichas.forEach(f => {
    if (!numero(f)){ f.meta = f.meta || {}; f.meta.n = prox++; }
  });
}
function salvarCfg(){ localStorage.setItem(K_SYNC, JSON.stringify(cfg)); }
function salvarUi(){ localStorage.setItem(K_UI, JSON.stringify(ui)); }

const estaRecolhida      = id => ui.recolhidas.includes(id);
const estaRecolhidaPais  = id => ui.recolhidasPais.includes(id);
const estaRecolhidaAutor = id => ui.recolhidasAutor.includes(id);
function alternarRecolhida(id, lista){
  const i = lista.indexOf(id);

  salvarUi();

function pintarSync(){
  const dot = $("#dot"), msg = $("#syncmsg");
  dot.className = "dot";
  if (!cfg.gist || !cfg.token){
    // sem gist ainda há trabalho a perder: o aviso não pode sumir
    if (sujo){ dot.classList.add("dirty"); msg.textContent = "alterações locais · sem sincronia"; }
    else { msg.textContent = "sem sincronia"; }
    return;
  }
  if (sujo){ dot.classList.add("dirty"); msg.textContent = "alterações locais"; return; }
  dot.classList.add("ok");
  msg.textContent = estado.savedAt ? "sincronizado " + estado.savedAt.slice(0,16).replace("T"," ") : "pronto";
}

/* ================================================================= gist */

async function gistGet(){
  const r = await fetch("https://api.github.com/gists/" + cfg.gist, {
    headers:{ Authorization:"Bearer "+cfg.token, Accept:"application/vnd.github+json" }
  });
  if (!r.ok) throw new Error("GitHub respondeu " + r.status + " ao buscar o gist.");
  const g = await r.json();
  const arq = g.files && g.files[ARQ];
  if (!arq) return null;
  // gists grandes vêm truncados; nesse caso o conteúdo real está no raw_url
  const texto = arq.truncated ? await (await fetch(arq.raw_url)).text() : arq.content;
  return JSON.parse(texto);
}

async function gistPut(payload){
  const r = await fetch("https://api.github.com/gists/" + cfg.gist, {
    method:"PATCH",
    headers:{ Authorization:"Bearer "+cfg.token, Accept:"application/vnd.github+json",
              "Content-Type":"application/json" },
    body: JSON.stringify({ files: { [ARQ]: { content: JSON.stringify(payload, null, 2) } } })
  });
  if (!r.ok) throw new Error("GitHub respondeu " + r.status + " ao gravar o gist.");
  return r.json();
}

async function buscar({silencioso=false}={}){
  if (!cfg.gist || !cfg.token) return abrirConfig("Configure o Gist e o token antes de sincronizar.");
  try {
    const remoto = await gistGet();
    if (!remoto){ return aviso("O gist ainda não tem " + ARQ + ". Use Enviar para criar o arquivo.", "warn"); }
    if (sujo && !confirm("Você tem alterações locais não enviadas. Buscar vai descartá-las. Continuar?")) return;
    estado = remoto;
    normalizar();                       // gists antigos não trazem paises[]
    cfg.seen = remoto.savedAt || null;
    sujo = false;
    salvarLocal(); salvarCfg(); render();
    if (!silencioso) aviso("Caderno atualizado: " + estado.fichas.length + " fichas.", "ok");
  } catch(e){ aviso(e.message, "err"); }
}

async function enviar(){
  if (!cfg.gist || !cfg.token) return abrirConfig("Configure o Gist e o token antes de sincronizar.");
  try {
    // conflito por timestamp: o remoto mudou desde a última vez que vi?
    let remoto = null;
    try { remoto = await gistGet(); } catch(e){ /* gist novo ou vazio */ }
    if (remoto && remoto.savedAt && remoto.savedAt !== cfg.seen){
      // sem `seen` o navegador nunca viu o gist: enviar aqui apaga tudo em
      // silêncio, que é justamente o caso mais perigoso
      const nuncaViu = !cfg.seen;
      const perde = [];
      if ((remoto.fichas||[]).length  > (estado.fichas||[]).length)  perde.push("fichas");
      if ((remoto.paises||[]).length  > (estado.paises||[]).length)  perde.push("dossiês de país");
      if ((remoto.autores||[]).length > (estado.autores||[]).length) perde.push("autores");
      if ((remoto.leituras||[]).length > (estado.leituras||[]).length) perde.push("leituras pendentes");

      let msg = nuncaViu
        ? "Este navegador nunca buscou o gist, e o gist já tem conteúdo.\n"
        : "O gist foi alterado em " + remoto.savedAt.slice(0,16).replace("T"," ") + ".\n";
      if (perde.length) msg += "\nO gist tem MAIS " + perde.join(", ") + " do que esta tela.\n";
      msg += "\nEnviar agora sobrescreve o que está lá.\nSe quiser trazer o gist para cá, cancele e clique em Buscar.\n\nSobrescrever mesmo assim?";
      if (!confirm(msg)) return;
    }
    estado.savedAt = agora();
    estado.schema = 1;
    await gistPut(estado);
    cfg.seen = estado.savedAt;
    sujo = false;
    salvarLocal(); salvarCfg();
    aviso("Enviado: " + estado.fichas.length + " fichas.", "ok");
  } catch(e){ aviso(e.message, "err"); }
}

/* =============================================================== filtros */

function fichasVisiveis(){
  const termo = filtros.busca.trim().toLowerCase();
  return estado.fichas.filter(f => {
    for (const chave of FILTRAVEIS){
      const sel = filtros[chave];
      if (sel.length === 0) continue;
      const vals = lista(f, chave).length ? lista(f, chave) : [campo(f, chave)];
      if (!vals.some(v => sel.includes(v))) return false;
    }
    if (termo){
      const alvo = [
        JSON.stringify(f.meta||{}),
        (f.secoes||[]).map(s => s.titulo + " " + s.corpo).join(" ")
      ].join(" ").toLowerCase();
      if (!alvo.includes(termo)) return false;
    }
    return true;
  });
}

function valoresDe(chave){
  const set = new Set();
  estado.fichas.forEach(f => {
    const vals = lista(f, chave).length ? lista(f, chave) : [campo(f, chave)];
    vals.forEach(v => { if (v) set.add(v); });
  });
  return [...set].sort();
}

function renderFiltros(){
  const box = $("#filtros");
  box.innerHTML = "";

  const gBusca = el("div","fgroup");
  gBusca.appendChild(el("span",null,"Busca"));
  const inp = el("input","search");
  inp.type="search"; inp.placeholder="autor, conceito, trecho…"; inp.value = filtros.busca;
  inp.addEventListener("input", e => { filtros.busca = e.target.value; renderConteudo(); atualizarContagem(); });
  gBusca.appendChild(inp);
  box.appendChild(gBusca);

  // os eixos de classificação são das fichas; na lista de leituras só a busca vale
  if (aba === "leituras"){
    const cont = el("span","fcount"); cont.id="fcount";
    box.appendChild(cont);
    return atualizarContagem();
  }

  FILTRAVEIS.forEach(chave => {
    let vals = valoresDe(chave);
    if (vals.length < 2) return;
    // os quatro casos da tese vêm primeiro e marcados
    if (chave === "regiao"){
      vals = vals.slice().sort((a,b) => {
        const foco = paisesFoco();
        const fa = foco.indexOf(a), fb = foco.indexOf(b);
        if (fa >= 0 && fb >= 0) return fa - fb;
        if (fa >= 0) return -1;
        if (fb >= 0) return 1;
        return a.localeCompare(b);
      });
    }
    const g = el("div","fgroup");
    g.appendChild(el("span",null,EIXOS[chave]||chave));
    const chips = el("div","chips");
    vals.forEach(v => {
      const foco = chave === "regiao" && paisesFoco().includes(v);
      const b = el("button", foco ? "chip foco" : "chip", v);
      b.type="button";
      b.setAttribute("aria-pressed", filtros[chave].includes(v) ? "true" : "false");
      b.addEventListener("click", () => {
        const i = filtros[chave].indexOf(v);
        if (i >= 0) filtros[chave].splice(i,1); else filtros[chave].push(v);
        renderFiltros(); renderConteudo(); atualizarContagem();
      });
      chips.appendChild(b);
    });
    g.appendChild(chips);
    box.appendChild(g);
  });

  const limpar = el("div","fgroup");
  limpar.appendChild(el("span",null," "));
  const bl = el("button","btn quiet","Limpar");
  bl.type="button";
  bl.addEventListener("click", () => {
    filtros.busca=""; FILTRAVEIS.forEach(f=>filtros[f]=[]);
    renderFiltros(); renderConteudo(); atualizarContagem();
  });
  limpar.appendChild(bl);
  box.appendChild(limpar);

  const cont = el("span","fcount"); cont.id="fcount";
  box.appendChild(cont);
  atualizarContagem();
}
function atualizarContagem(){
  const c = $("#fcount"); if (!c) return;
  if (aba === "leituras"){
    const n = (estado.leituras||[]).length;
    c.textContent = n + (n === 1 ? " leitura na lista" : " leituras na lista");
    return;
  }
  const v = fichasVisiveis().length, t = estado.fichas.length;
  c.textContent = v === t ? t + " fichas" : v + " de " + t + " fichas";
}

/* ================================================================ índice */

function abrirIndice(){
  const dr = $("#indice");
  dr.innerHTML = "";
  const visiveis = new Set(fichasVisiveis().map(f => f.id));
  const todas = ordenadas(estado.fichas);

  const hd = el("header");
  const hh = el("div"); hh.style.flex = "1";
  hh.appendChild(el("h3",null,"Índice"));
  const nums = el("div","resumo-num");
  const conta = st => todas.filter(f => campo(f,"status") === st).length;
  nums.appendChild(el("span",null, todas.length + " fichas"));
  if (conta("completa"))  nums.appendChild(el("span",null, conta("completa") + " completas"));
  if (conta("pre-ficha")) nums.appendChild(el("span",null, conta("pre-ficha") + " pré-fichas"));
  if (visiveis.size !== todas.length) nums.appendChild(el("span",null, visiveis.size + " passam nos filtros"));
  hh.appendChild(nums);
  hd.appendChild(hh);
  const fechar = el("button","toggle","×");
  fechar.title = "Fechar"; fechar.addEventListener("click", fecharIndice);
  hd.appendChild(fechar);
  dr.appendChild(hd);

  const corpo = el("div","corpo");

  /* cada ficha entra num grupo só, senão a contagem do índice mente.
     Prioridade: primeiro caso da tese que ela cobre; senão a primeira região. */
  const grupoDe = f => {
    const rs = lista(f,"regiao");
    const foco = paisesFoco().find(p => rs.includes(p));
    if (foco) return foco;
    return rs.length ? rs[0] : "__sem";
  };
  const porGrupo = {};
  todas.forEach(f => { (porGrupo[grupoDe(f)] = porGrupo[grupoDe(f)] || []).push(f); });

  const ordem = paisesFoco();
  Object.keys(porGrupo).sort().forEach(k => { if (!ordem.includes(k) && k !== "__sem") ordem.push(k); });
  ordem.push("__sem");

  ordem.forEach(chave => {
    const doGrupo = porGrupo[chave];
    if (!doGrupo || !doGrupo.length) return;
    const foco = paisesFoco().includes(chave);
    const bloco = el("div", foco ? "grupo foco" : "grupo");
    const rot = chave === "__sem" ? "Sem região declarada" : nomePais(chave);
    bloco.appendChild(el("span",null, rot + " · " + doGrupo.length));
    corpo.appendChild(bloco);
    doGrupo.forEach(f => {
      const b = el("button", visiveis.has(f.id) ? "ix" : "ix oculta");
      b.appendChild(el("span","num", numero(f) ? String(numero(f)).padStart(2,"0") : "—"));
      b.appendChild(el("span","ano", campo(f,"ano") || "—"));
      const nome = el("span","nome", rotulo(f));
      // as demais regiões da ficha ficam anotadas, para não sumirem do índice
      const extras = lista(f,"regiao").filter(r => r !== chave);
      const sm = el("small", null, (campo(f,"titulo") || f.id) + (extras.length ? "  ·  também: " + extras.join(", ") : ""));
      nome.appendChild(sm);
      b.appendChild(nome);
      const st = campo(f,"status") || "—";
      b.appendChild(el("span","st " + st, st));
      // do índice direto para a leitura: é o caminho de quem vai ler o artigo
      b.addEventListener("click", () => { fecharIndice(); abrirLeitura(f.id); });
      corpo.appendChild(b);
    });
  });

  dr.appendChild(corpo);
  dr.hidden = false;
  $("#backdrop").hidden = false;
}
function fecharIndice(){ $("#indice").hidden = true; $("#backdrop").hidden = true; }

/* Estado vazio de qualquer aba: o motivo quase sempre é cópia local

  const b = el("button","btn solid", rotulo || "Buscar do Gist");
  b.addEventListener("click", () => buscar());
  return b;

/* O rótulo bonito de uma região vem do dossiê correspondente, que está no
   Gist. Sem dossiê, mostra o próprio slug — nomes de país não ficam neste
   arquivo público. Criar o dossiê é o que arruma o rótulo. */
function nomePais(chave){
  const p = (estado.paises||[]).find(x => x.id === chave);
  if (p && p.nome) return p.nome;
  return chave.replace(/-/g," ").replace(/^\w/, c => c.toUpperCase());
}

function irParaFicha(id){
  if (!estado.fichas.some(f => f.id === id)) return aviso("Ainda não existe uma ficha " + id + ".", "warn");

  const i = ui.recolhidas.indexOf(id);
  if (i >= 0){ ui.recolhidas.splice(i,1); salvarUi(); }
  irPara("fichas");
  setTimeout(() => { const n = document.getElementById("f-"+id); if (n) n.scrollIntoView({block:"start"}); }, 40);
}

/* Trocar o id à mão quebra em silêncio: os [[links]] das outras fichas e a
   lista de recolhidas continuam apontando para o nome velho. Aqui a troca
   arrasta tudo junto. */
function renomearFicha(f){
  const atual = f.id;
  const bruto = prompt("Novo id para esta ficha.\nOs [[links]] das outras fichas e os vínculos com autores são reescritos junto.", atual);
  if (bruto === null) return;
  const novo = paraSlug(bruto);
  if (!novo) return aviso("Id inválido.", "err");
  if (novo === atual) return;
  if (estado.fichas.some(x => x.id === novo)) return aviso("Já existe uma ficha com o id " + novo + ".", "err");

  let links = 0;
  const trocarLinks = objs => objs.forEach(o => (o.secoes||[]).forEach(s => {
    if (!s.corpo) return;
    const antes = s.corpo;
    s.corpo = s.corpo.split("[[" + atual + "]]").join("[[" + novo + "]]");
    if (s.corpo !== antes) links++;
  }));
  trocarLinks(estado.fichas);
  trocarLinks(estado.paises);

  const alvo = estado.fichas.find(x => x.id === atual);
  alvo.id = novo;
  alvo.meta = alvo.meta || {};
  alvo.meta.id = novo;

  ["recolhidas"].forEach(k => {
    const i = ui[k].indexOf(atual);
    if (i >= 0) ui[k][i] = novo;
  });
  if (leitura === atual) leitura = novo;
  if (editando === atual) editando = novo;

  salvarUi(); sujo = true; salvarLocal(); render();
  aviso("Renomeada para " + novo + ". " + (links ? links + " seção(ões) com [[links]] atualizadas." : "Nenhum [[link]] apontava para ela."), "ok");
}

function cardEdicao(f){
  const art = el("article","ficha"); art.id = "f-" + f.id;
  const rascunho = JSON.parse(JSON.stringify(f));

  const bar = el("div","edit-bar");
  const salvar = el("button","btn solid","Salvar");
  const cancelar = el("button","btn quiet","Cancelar");
  const renomear = el("button","btn quiet","Renomear id");
  renomear.title = "Troca o id e arruma sozinho os [[links]] e os vínculos com autores";
  renomear.addEventListener("click", () => renomearFicha(f));
  const apagar = el("button","btn danger","Apagar ficha");

      .map(x => ({ id:x.id, rotulo:x.nome || x.id,
                   detalhe:[x.afiliacao, x.sede].filter(Boolean).join(" · ") })),

  );
  fdA.appendChild(pickerAutores.elemento);

  art.appendChild(grid);

  const rows = el("div","rows");
  (rascunho.secoes||[]).forEach((s, i) => {
    const r = el("div", MINHA_VOZ.includes(s.codigo) ? "row mine" : "row");
    const l = el("div","lbl"); l.appendChild(el("b",null,s.codigo));

  });
  art.appendChild(rows);

  salvar.addEventListener("click", () => {
    rascunho.meta = rascunho.meta || {};
    rascunho.meta.autores = pickerAutores.marcados();
    const idx = estado.fichas.findIndex(x => x.id === f.id);
    if (idx >= 0) estado.fichas[idx] = rascunho;

  });

  apagar.addEventListener("click", () => {
    if (!confirm("Apagar a ficha " + f.id + "? Isso só vale localmente até você clicar em Enviar.")) return;
    estado.fichas = estado.fichas.filter(x => x.id !== f.id);
    editando = null; sujo = true; salvarLocal(); render();
  });

  return art;
}

/* =============================================================== autores */
/* Um artigo pode ter vários autores, então a ligação é por lista de ids em
   ficha.meta.autores. O campo `autor` continua sendo só o texto de exibição. */

function autorVazio(id, nome){
  return { id, nome:nome||id, pais:"", sede:"", afiliacao:"", area:"",
           email:"", orcid:"", link:"", foto:"", obs:"" };
}

/* ORCID e Lattes têm ambos 16 dígitos, então o que distingue é a convenção
   de escrita: ORCID vem hifenizado em grupos de quatro, Lattes vem em bloco.
   URL colada inteira é respeitada como está. */
function urlIdentificador(v){
  const t = (v||"").trim();
  if (!t) return null;
  if (/^https?:\/\//i.test(t)) return t;
  if (/^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/i.test(t)) return "https://orcid.org/" + t.toUpperCase();
  if (/^\d{16}$/.test(t)) return "http://lattes.cnpq.br/" + t;
  return null;
}

function fichasDoAutor(a){
  return estado.fichas.filter(f => {
    const ids = lista(f,"autores");
    if (ids.length) return ids.includes(a.id);
    // fallback para fichas ainda sem o vínculo explícito: sobrenome do autor
    const sobrenome = (a.nome||"").split(",")[0].trim().toLowerCase();
    if (sobrenome.length < 4) return false;
    return (campo(f,"autor")||"").toLowerCase().includes(sobrenome);
  });
}

/* Letras que a decomposição NFD não resolve porque não são acentos: numa
   bibliografia de segurança internacional, Wæver e Bjørn aparecem. */
const LETRAS_SOLTAS = { "æ":"ae", "œ":"oe", "ø":"o", "å":"a", "ß":"ss", "đ":"d", "ð":"d", "þ":"th", "ł":"l" };
function paraSlug(txt){
  return (txt||"").toLowerCase()
    .replace(/[æœøåßđðþł]/g, c => LETRAS_SOLTAS[c] || c)
    .normalize("NFD").replace(/\p{Diacritic}/gu, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

/* Lista de caixas de seleção. Devolve um objeto que sabe dizer o que está
   marcado — vínculo se escolhe clicando, não digitando id. */
function criarPicker(itens, marcados, vazio){
  const box = el("div","picker");
  const set = new Set(marcados);
  if (!itens.length){
    box.appendChild(el("div","picker-vazio", vazio || "nada disponível"));
    return { elemento: box, marcados: () => [] };
  }
  itens.forEach(it => {
    const lb = el("label");
    const cb = el("input"); cb.type = "checkbox"; cb.value = it.id;
    cb.checked = set.has(it.id);
    cb.addEventListener("change", () => {
      if (cb.checked) set.add(it.id); else set.delete(it.id);
    });
    const rot = el("span","rot");
    rot.appendChild(document.createTextNode(it.rotulo));
    if (it.detalhe) rot.appendChild(el("small",null,it.detalhe));
    lb.appendChild(cb); lb.appendChild(rot);
    box.appendChild(lb);
  });
  return { elemento: box, marcados: () => itens.filter(i => set.has(i.id)).map(i => i.id) };
}

/* Vínculos que apontam para quem não existe — foi assim que a renomeação
   de um autor quebrou em silêncio. */
function vinculosQuebrados(){
  const idsAutores = new Set(estado.autores.map(a => a.id));
  const quebrados = [];
  estado.fichas.forEach(f => {
    lista(f,"autores").forEach(id => {
      if (!idsAutores.has(id)) quebrados.push({ ficha:f.id, autor:id });
    });
  });
  return quebrados;
}

function iniciais(nome){
  const partes = (nome||"?").replace(/,/g," ").split(/\s+/).filter(Boolean);
  if (!partes.length) return "?";
  const a = partes[0][0] || "";
  const b = partes.length > 1 ? (partes[partes.length-1][0] || "") : "";
  return (a + b).toUpperCase();
}

/* Reduz a imagem a um quadrado pequeno antes de guardar: o dataURI viaja
   dentro do caderno.json, e foto de 3 MB estoura o localStorage. */
function processarFoto(file, cb){
  const fr = new FileReader();
  fr.onerror = () => cb(null, "Não consegui ler o arquivo.");
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => cb(null, "O arquivo não parece ser uma imagem.");
    img.onload = () => {
      try {
        const lado = FOTO_LADO;
        const c = document.createElement("canvas");
        c.width = lado; c.height = lado;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,lado,lado);
        const min = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, lado, lado);
        cb(c.toDataURL("image/jpeg", 0.82), null);
      } catch(e){ cb(null, "Não consegui processar a imagem: " + e.message); }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

  const pane = $("#pane-autores");
  pane.innerHTML = "";

  pane.appendChild(el("h2","sec","Autores"));

      "Os autores moram no Gist, como as fichas e os dossiês. Se você já os tem lá, o que falta é puxar: esta tela guarda uma cópia e ela não se atualiza sozinha."));

    });
    al.appendChild(b);
    pane.appendChild(al);
  }

  // panorama curto: para uma tese sobre geografia epistêmica, onde os autores
  // estão sediados é dado, não decoração
  const porSede = {};
  estado.autores.forEach(a => { const k = a.sede || "sem país"; porSede[k] = (porSede[k]||0)+1; });

  });
  if (semFoto) resumo.appendChild(el("span",null, semFoto + " sem foto"));
  pane.appendChild(resumo);

  const barra = el("div","barra-ferramentas");
  const bRec = el("button","btn quiet","Recolher todos");
  bRec.addEventListener("click", () => {
    estado.autores.forEach(a => { if (!estaRecolhidaAutor(a.id)) ui.recolhidasAutor.push(a.id); });
    salvarUi(); renderConteudo();

  const bExp = el("button","btn quiet","Expandir todos");
  bExp.addEventListener("click", () => { ui.recolhidasAutor = []; salvarUi(); renderConteudo(); });
  const bNovo = el("button","btn quiet","+ Autor");
  bNovo.addEventListener("click", novoAutor);

  tg.setAttribute("aria-expanded", estaRecolhidaAutor(a.id) ? "false" : "true");
  tg.addEventListener("click", () => {
    alternarRecolhida(a.id, ui.recolhidasAutor);
    art.classList.toggle("recolhida");
    const fechada = art.classList.contains("recolhida");
    tg.textContent = fechada ? "+" : "−";
    tg.setAttribute("aria-expanded", fechada ? "false" : "true");
  });
  acoes.appendChild(tg);
  hd.appendChild(acoes);
  art.appendChild(hd);

  const campos = el("dl","campos");
  CAMPOS_AUTOR.forEach(([k, rot]) => {
    if (k === "nome") return;   // já está no cabeçalho
    const linha = el("div","linha-campo");
    linha.appendChild(el("dt",null,rot));
    const dd = el("dd");
    const v = (a[k]||"").trim();

    else if (k === "email"){
      const lk = el("a",null,v);
      lk.href = "mailto:" + v;
      dd.appendChild(lk);
    } else if (k === "orcid" || k === "link"){
      const href = k === "link"
        ? (/^https?:\/\//i.test(v) ? v : null)
        : urlIdentificador(v);
      if (href){
        const lk = el("a",null,v);
        lk.href = href; lk.target = "_blank"; lk.rel = "noopener noreferrer";
        dd.appendChild(lk);
      } else dd.textContent = v;
    } else dd.textContent = v;
    linha.appendChild(dd);
    campos.appendChild(linha);
  });
  art.appendChild(campos);

  const fichas = fichasDoAutor(a);
  const box = el("div","fichas-do-pais");
  box.appendChild(el("span","rot-rel", fichas.length ? "fichas" : "sem fichas"));
  fichas.forEach(f => {
    const b = el("button", null, rotulo(f));
    b.title = campo(f,"titulo");

  });

  const obs = el("div","obs");

  else txt.appendChild(el("p","leitura-vazia","sem comentários ainda"));
  obs.appendChild(txt);

  return art;
}

function cardAutorEdicao(a){
  const art = el("article","autor");
  art.id = "a-" + a.id;
  const rascunho = JSON.parse(JSON.stringify(a));

  const bar = el("div","edit-bar");
  const salvar = el("button","btn solid","Salvar");
  const cancelar = el("button","btn quiet","Cancelar");
  const apagar = el("button","btn danger","Apagar");
  bar.appendChild(salvar); bar.appendChild(cancelar); bar.appendChild(apagar);
  bar.appendChild(el("span","note", a.id));
  art.appendChild(bar);

  const grid = el("div","autor-edit");

  // ----- foto -----
  const previa = el("div");
  previa.style.cssText = "display:flex;gap:12px;align-items:center;grid-column:1/-1";
  const alvoImg = el("div");
  const pintarPrevia = () => {
    alvoImg.innerHTML = "";
    if (rascunho.foto){
      const img = el("img","retrato"); img.src = rascunho.foto; img.alt = "";
      alvoImg.appendChild(img);
    } else alvoImg.appendChild(el("div","retrato-vazio", iniciais(rascunho.nome)));
  };
  pintarPrevia();
  previa.appendChild(alvoImg);
  const dica = el("div");
  dica.style.cssText = "font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);line-height:1.6";
  dica.textContent = "A imagem é recortada num quadrado de " + FOTO_LADO + "px e guardada dentro do caderno. Use retratos pequenos.";
  previa.appendChild(dica);
  grid.appendChild(previa);

  const ctrl = el("div","foto-controles");
  const inpFile = el("input"); inpFile.type = "file"; inpFile.accept = "image/*";
  inpFile.addEventListener("change", () => {
    const file = inpFile.files && inpFile.files[0];
    if (!file) return;
    processarFoto(file, (dataUri, erro) => {
      if (erro) return aviso(erro, "err");
      rascunho.foto = dataUri;
      pintarPrevia();
      if (dataUri.length > FOTO_ALERTA)
        aviso("A foto ficou com " + Math.round(dataUri.length/1024) + " KB. Funciona, mas várias assim engordam o Gist.", "warn");
    });
  });
  ctrl.appendChild(inpFile);
  const bUrl = el("button","btn quiet","Usar URL");
  bUrl.addEventListener("click", () => {
    const u = prompt("Endereço da imagem (fica como link externo, não é copiada para o caderno):", rascunho.foto && rascunho.foto.startsWith("http") ? rascunho.foto : "https://");
    if (u === null) return;
    rascunho.foto = u.trim(); pintarPrevia();
  });
  ctrl.appendChild(bUrl);
  const bSem = el("button","btn quiet","Remover foto");
  bSem.addEventListener("click", () => { rascunho.foto = ""; pintarPrevia(); });
  ctrl.appendChild(bSem);
  grid.appendChild(ctrl);

  // ----- campos -----
  CAMPOS_AUTOR.forEach(([k, rot]) => {
    const fd = el("div","field");
    if (k === "afiliacao" || k === "link" || k === "area") fd.classList.add("largo");
    fd.appendChild(el("label",null,rot));
    const inp = el("input");
    inp.value = rascunho[k] || "";
    if (k === "pais" || k === "sede") inp.placeholder = "ex.: Brasil";
    if (k === "link")  inp.placeholder = "https://";
    if (k === "email") { inp.type = "email"; inp.placeholder = "nome@instituicao.edu"; }
    if (k === "orcid") inp.placeholder = "0000-0002-1825-0097 ou 16 dígitos do Lattes";
    inp.addEventListener("input", e => { rascunho[k] = e.target.value; });
    fd.appendChild(inp); grid.appendChild(fd);
  });

  // ----- fichas ligadas -----
  const fdF = el("div","field largo");
  fdF.appendChild(el("label",null,"fichas deste autor — marque as que ele assina"));
  const pickerFichas = criarPicker(
    estado.fichas.map(f => ({
      id: f.id,
      rotulo: rotulo(f) + " — " + (campo(f,"titulo") || f.id),
      detalhe: f.id
    })),
    estado.fichas.filter(f => lista(f,"autores").includes(a.id)).map(f => f.id),
    "nenhuma ficha no caderno ainda"
  );
  fdF.appendChild(pickerFichas.elemento);
  grid.appendChild(fdF);
  art.appendChild(grid);

  // ----- observações -----
  const obs = el("div","obs");
  obs.appendChild(el("span",null,"Observações"));
  const ta = el("textarea");
  ta.value = rascunho.obs || "";
  ta.placeholder = "Comentários pessoais: posição no debate, quem orientou, com quem publica, o que desconfio…";
  ta.addEventListener("input", e => { rascunho.obs = e.target.value; });
  obs.appendChild(ta);
  art.appendChild(obs);

  salvar.addEventListener("click", () => {
    const i = estado.autores.findIndex(x => x.id === a.id);
    if (i >= 0) estado.autores[i] = rascunho;
    // reescreve o vínculo dos dois lados, para não sobrar autor fantasma
    const idsFichas = pickerFichas.marcados();
    estado.fichas.forEach(f => {
      const atuais = lista(f,"autores");
      const deve = idsFichas.includes(f.id);
      const tem = atuais.includes(a.id);
      if (deve && !tem) atuais.push(a.id);
      if (!deve && tem) atuais.splice(atuais.indexOf(a.id), 1);
      f.meta = f.meta || {};
      f.meta.autores = atuais;
    });
    editandoAutor = null; sujo = true; salvarLocal(); render();
  });
  cancelar.addEventListener("click", () => { editandoAutor = null; renderConteudo(); });
  apagar.addEventListener("click", () => {
    if (!confirm("Apagar a ficha de autor de " + (a.nome||a.id) + "? As fichas de artigo não são afetadas.")) return;
    estado.autores = estado.autores.filter(x => x.id !== a.id);
    estado.fichas.forEach(f => {
      const atuais = lista(f,"autores");
      if (atuais.includes(a.id)){ atuais.splice(atuais.indexOf(a.id),1); f.meta.autores = atuais; }
    });
    editandoAutor = null; sujo = true; salvarLocal(); render();
  });

  return art;
}

    const i2 = el("input"); i2.placeholder="ex.: sobrenome-nome"; f2.appendChild(i2); b.appendChild(f2);
    i1.addEventListener("input", () => {
      if (i2.dataset.tocado) return;
      i2.value = paraSlug(i1.value);
    });
    i2.addEventListener("input", () => { i2.dataset.tocado = "1"; });

    const a = el("div","modal-actions");
    const ok = el("button","btn solid","Criar");
    ok.addEventListener("click", () => {
      const id = i2.value.trim();
      if (!id) return aviso("O id é obrigatório.", "err");
      if (estado.autores.some(x => x.id === id)) return aviso("Já existe um autor com esse id.", "err");
      estado.autores.push(autorVazio(id, i1.value.trim() || id));
      sujo = true; editandoAutor = id; salvarLocal(); fecharModal(); irPara("autores"); render();
    });
    const fe = el("button","btn quiet","Cancelar"); fe.addEventListener("click", fecharModal);
    a.appendChild(ok); const sp=el("span","spacer"); a.appendChild(sp); a.appendChild(fe);
    b.appendChild(a);
  });
}

/* ==================================================== leituras pendentes */
/* Uma lista só para o que estava espalhado pelo P6 dos dossiês e pelo texto
   das fichas. O `id` de cada item é o id que a ficha terá: quando ela existir,
   o item passa sozinho a «fichada». */

function ltFicha(l){ return l.id ? estado.fichas.find(f => f.id === l.id) || null : null; }
function ltEstado(l){ return ltFicha(l) ? "fichada" : (LT_STATUS[l.status] ? l.status : "a-ler"); }
function ltRotulo(l){ return (l.autor || l.id) + (l.ano ? " (" + l.ano + ")" : ""); }
function ltVazia(id){
  const ano = (id.match(/(19|20)\d{2}/) || [""])[0];
  return { id, autor:"", ano, titulo:"", onde:"", tipo:"literatura", grupo:"", prioridade:"media",
           status:"a-ler", capitulo:"", acesso:"", indicadaPor:[], motivo:"" };
}
function ltPeso(p){ return { alta:0, media:1, baixa:2 }[p] ?? 1; }

/* De onde a indicação veio: ficha (abre a leitura) ou dossiê (vai ao país). */
function ltOrigemBotao(o){
  if (o.startsWith("dossie:")){
    const pid = o.slice(7);
    const b = el("button","fraca","dossiê " + nomePais(pid));
    b.addEventListener("click", () => {
      const i = ui.recolhidasPais.indexOf(pid);
      if (i >= 0){ ui.recolhidasPais.splice(i,1); salvarUi(); }
      irPara("paises");
      setTimeout(() => { const n = document.getElementById("p-"+pid); if (n) n.scrollIntoView({block:"start"}); }, 40);
    });
    return b;
  }
  const f = estado.fichas.find(x => x.id === o);
  const b = el("button", f ? null : "fraca", f ? numFmt(f) + " " + rotulo(f) : o);
  if (f){ b.title = campo(f,"titulo"); b.addEventListener("click", () => abrirLeitura(f.id)); }
  else b.disabled = true;
  return b;
}

/* O que o caderno já aponta e a lista ainda não tem: links para fichas que não
   existem e referências que várias fichas partilham. */
function ltSugestoes(){
  const fichas = new Set(estado.fichas.map(f => f.id));
  const naLista = new Set(estado.leituras.map(l => l.id));
  const links = {}, refs = {};
  estado.fichas.forEach(f => {
    const texto = (f.secoes||[]).map(s => s.corpo).join("\n");
    (texto.match(/\[\[([^\]]+)\]\]/g) || []).forEach(m => {
      const alvo = m.slice(2,-2).trim();
      if (fichas.has(alvo) || naLista.has(alvo)) return;
      (links[alvo] = links[alvo] || new Set()).add(f.id);
    });
    lista(f,"refs").forEach(r => {
      if (fichas.has(r) || naLista.has(r)) return;
      (refs[r] = refs[r] || new Set()).add(f.id);
    });
  });
  const ord = o => Object.entries(o).map(([k,v]) => [k,[...v]]).sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  return {
    links: ord(links),
    refs: ord(refs).filter(([k,q]) => q.length >= LT_MIN_REFS && !links[k])
  };
}

function ltChaveGrupo(l){
  const k = ui.ltAgrupar;
  if (k === "prioridade") return LT_PRIOR[l.prioridade] ? l.prioridade : "media";
  if (k === "capitulo")   return l.capitulo || "sem capítulo";
  if (k === "tipo")       return LT_TIPOS[l.tipo] ? l.tipo : "literatura";
  return l.grupo || "sem tema";
}
function ltNomeGrupo(chave){
  const k = ui.ltAgrupar;
  if (k === "prioridade") return "prioridade " + (LT_PRIOR[chave] || chave);
  if (k === "tipo")       return LT_TIPOS[chave] || chave;
  return chave;
}

function renderLeituras(){
  const pane = $("#pane-leituras");
  pane.innerHTML = "";
  pane.appendChild(el("h2","sec","Leituras pendentes"));
  pane.appendChild(el("p","hint",
    "O que ainda falta ler e fichar, num lugar só. Cada item guarda quem o indicou e por quê. O id é o que a ficha vai ter: quando ela entrar no caderno, o item passa sozinho para «já fichadas». A busca do topo também filtra esta lista."));

  const sug = ltSugestoes();
  if (!estado.leituras.length && !sug.links.length && !sug.refs.length){
    const d = el("div","empty-state");
    d.appendChild(el("h3",null,"Nenhuma leitura pendente nesta cópia local"));
    d.appendChild(el("p",null,"A lista mora no Gist, como as fichas. Se ela já existe lá, falta buscar."));
    const acoes = el("div","modal-actions"); acoes.style.justifyContent = "center";
    acoes.appendChild(botaoBuscar());
    const b = el("button","btn quiet","+ Leitura"); b.addEventListener("click", novaLt);
    acoes.appendChild(b); d.appendChild(acoes);
    return pane.appendChild(d);
  }

  // resumo
  const cont = { "a-ler":0, lendo:0, fichada:0, descartada:0 };
  const alta = estado.leituras.filter(l => ltEstado(l) === "a-ler" && l.prioridade === "alta").length;
  estado.leituras.forEach(l => cont[ltEstado(l)]++);
  const resumo = el("div","resumo-lt");
  [["a ler", cont["a-ler"]], ["lendo", cont.lendo], ["já fichadas", cont.fichada], ["descartadas", cont.descartada]]
    .forEach(([r,n]) => { const s = el("span"); s.innerHTML = "<b>"+n+"</b> "+r; resumo.appendChild(s); });
  if (alta) { const s = el("span"); s.innerHTML = "<b>"+alta+"</b> de prioridade alta ainda por ler"; resumo.appendChild(s); }
  pane.appendChild(resumo);

  // barra
  const barra = el("div","barra-ferramentas");
  const mkSelect = (rot, opcoes, atual, aoMudar) => {
    const lb = el("label","ordem"); lb.appendChild(document.createTextNode(rot));
    const sel = el("select");
    Object.entries(opcoes).forEach(([k,v]) => { const o = el("option",null,v); o.value = k; if (k === atual) o.selected = true; sel.appendChild(o); });
    sel.addEventListener("change", () => aoMudar(sel.value));
    lb.appendChild(sel); return lb;
  };
  barra.appendChild(mkSelect("Mostrar", LT_VER, ui.ltVer, v => { ui.ltVer = v; salvarUi(); renderConteudo(); }));
  barra.appendChild(mkSelect("Agrupar por", LT_AGRUPAR, ui.ltAgrupar, v => { ui.ltAgrupar = v; salvarUi(); renderConteudo(); }));
  const bNova = el("button","btn quiet","+ Leitura"); bNova.addEventListener("click", novaLt);
  barra.appendChild(bNova);
  pane.appendChild(barra);

  // filtro
  const termo = filtros.busca.trim().toLowerCase();
  const vis = estado.leituras.filter(l => {
    const st = ltEstado(l);
    if (ui.ltVer === "pendentes"   && !(st === "a-ler" || st === "lendo")) return false;
    if (ui.ltVer === "fichadas"    && st !== "fichada") return false;
    if (ui.ltVer === "descartadas" && st !== "descartada") return false;
    if (termo && !JSON.stringify(l).toLowerCase().includes(termo)) return false;
    return true;
  });

  if (!vis.length){
    pane.appendChild(el("p","hint", estado.leituras.length ? "Nada nesta seleção." : "A lista ainda está vazia. Comece pelas sugestões abaixo."));
  }

  // grupos, na ordem em que aparecem na lista (ou na ordem natural da chave)
  const grupos = new Map();
  vis.forEach(l => { const k = ltChaveGrupo(l); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(l); });
  let chaves = [...grupos.keys()];
  if (ui.ltAgrupar === "prioridade") chaves.sort((a,b) => ltPeso(a) - ltPeso(b));
  else if (ui.ltAgrupar !== "grupo") chaves.sort((a,b) => a.localeCompare(b, "pt"));
  chaves.forEach(k => {
    const itens = grupos.get(k).slice().sort((a,b) =>
      ltPeso(a.prioridade) - ltPeso(b.prioridade) || (a.autor||a.id).localeCompare(b.autor||b.id, "pt"));
    const sec = el("section","lt-grupo");
    const h = el("h3", null, ltNomeGrupo(k));
    const pend = itens.filter(l => ["a-ler","lendo"].includes(ltEstado(l))).length;
    h.appendChild(el("small", null, itens.length + (itens.length === 1 ? " item" : " itens") +
      (pend !== itens.length ? " · " + pend + " pendentes" : "")));
    sec.appendChild(h);
    itens.forEach(l => sec.appendChild(editandoLt === l.id ? cardLtEdicao(l) : cardLt(l)));
    pane.appendChild(sec);
  });

  // sugestões automáticas
  if (sug.links.length || sug.refs.length){
    const sc = cardDobravel("Sugestões do próprio caderno, ainda fora da lista", "lt-sug");
    sc.card.style.marginTop = "10px";
    const c = sc.corpo;
    const linha = (id, quem, nota) => {
      const d = el("div","sug-lt");
      d.appendChild(el("code", null, id));
      d.appendChild(el("span","quem", nota + ": " + quem.join(", ")));
      const b = el("button","btn quiet","+ à lista");
      b.addEventListener("click", () => {
        const l = ltVazia(id); l.indicadaPor = quem.slice();
        estado.leituras.push(l);
        editandoLt = id; ltRecemCriada = id; sujo = true; salvarLocal(); renderConteudo();
        setTimeout(() => { const n = document.getElementById("lt-"+id); if (n) n.scrollIntoView({block:"start"}); }, 30);
      });
      d.appendChild(b);
      return d;
    };
    if (sug.links.length){
      c.appendChild(el("h4",null,"Fichas citadas com [[link]] e que ainda não existem"));
      sug.links.forEach(([id,quem]) => c.appendChild(linha(id, quem, "ligada por")));
    }
    if (sug.refs.length){
      c.appendChild(el("h4",null,"Referências partilhadas por " + LT_MIN_REFS + " fichas ou mais, sem ficha própria"));
      sug.refs.forEach(([id,quem]) => c.appendChild(linha(id, quem, quem.length + " fichas")));
    }
    pane.appendChild(sc.card);
  }
}

function cardLt(l){
  const st = ltEstado(l);
  const f = ltFicha(l);
  const prio = LT_PRIOR[l.prioridade] ? l.prioridade : "media";
  const art = el("article", "lt p-" + prio + (st === "fichada" || st === "descartada" ? " feita" : ""));
  art.id = "lt-" + l.id;

  const ref = el("div","ref-lt");
  ref.innerHTML = "<b>" + esc(ltRotulo(l)) + "</b>" +
    (l.titulo ? " · <em>" + esc(l.titulo) + "</em>" : "") +
    (l.onde ? ' <span class="onde">· ' + esc(l.onde) + "</span>" : "");
  const meta = el("div","meta-lt");
  meta.appendChild(el("span","pri " + prio, LT_PRIOR[prio]));
  if (l.tipo === "documento") meta.appendChild(el("span","st-lt","documento"));
  meta.appendChild(el("code", null, l.id));
  if (l.capitulo) meta.appendChild(el("span", null, l.capitulo));
  if (l.acesso)   meta.appendChild(el("span", null, "onde está: " + l.acesso));
  ref.appendChild(meta);
  art.appendChild(ref);

  if ((l.motivo||"").trim()){
    const m = el("div","motivo"); m.innerHTML = md(l.motivo); art.appendChild(m);
  }
  if (l.indicadaPor.length){
    const box = el("div","fichas-do-pais");
    box.appendChild(el("span","rot-rel","indicada por"));
    l.indicadaPor.forEach(o => box.appendChild(ltOrigemBotao(o)));
    art.appendChild(box);
  }

  const lado = el("div","lado");
  if (f){
    const b = el("button","btn quiet", "Abrir " + numFmt(f));
    b.addEventListener("click", () => abrirLeitura(f.id));
    lado.appendChild(el("span","st-lt fichada","já fichada"));
    lado.appendChild(b);
  } else {
    const sel = el("select");
    sel.setAttribute("aria-label", "Status de " + ltRotulo(l));
    Object.entries(LT_STATUS).forEach(([k,v]) => { const o = el("option",null,v); o.value = k; if (k === st) o.selected = true; sel.appendChild(o); });
    sel.addEventListener("change", () => { l.status = sel.value; sujo = true; salvarLocal(); renderConteudo(); });

  const be = el("button","btn quiet","Editar");

    setTimeout(() => { const n = document.getElementById("lt-"+l.id); if (n) n.scrollIntoView({block:"start"}); }, 0); });
  lado.appendChild(be);
  art.appendChild(lado);
  return art;
}

function cardLtEdicao(l){

  bar.appendChild(salvar); bar.appendChild(cancelar); bar.appendChild(apagar);
  bar.appendChild(el("span","note", "o id é o da ficha futura"));
  art.appendChild(bar);

  const grid = el("div","autor-edit");
  const texto = (k, rot, ph, largo) => {
    const fd = el("div","field" + (largo ? " largo" : ""));
    fd.appendChild(el("label",null,rot));
    const inp = el("input"); inp.value = r[k] || ""; if (ph) inp.placeholder = ph;
    inp.addEventListener("input", e => { r[k] = e.target.value; });
    fd.appendChild(inp); grid.appendChild(fd); return inp;
  };
  const escolha = (k, rot, opcoes) => {
    const fd = el("div","field");
    fd.appendChild(el("label",null,rot));
    const sel = el("select");
    Object.entries(opcoes).forEach(([kk,v]) => { const o = el("option",null,v); o.value = kk; if (kk === r[k]) o.selected = true; sel.appendChild(o); });
    sel.addEventListener("change", () => { r[k] = sel.value; });
    fd.appendChild(sel); grid.appendChild(fd);
  };
  texto("autor","autor(es)","ex.: Sobrenome, Nome");
  texto("ano","ano");
  texto("titulo","título",null,true);
  texto("onde","publicado em","revista, livro, editora…",true);
  texto("id","id da ficha futura","ex.: sobrenome2020");
  const gInp = texto("grupo","tema (agrupa a lista)","ex.: Teoria");
  const dl = el("datalist"); dl.id = "dl-grupos-lt";
  [...new Set(estado.leituras.map(x => x.grupo).filter(Boolean))].forEach(g => { const o = el("option"); o.value = g; dl.appendChild(o); });
  gInp.setAttribute("list", dl.id); grid.appendChild(dl);
  escolha("prioridade","prioridade",LT_PRIOR);
  escolha("status","status",LT_STATUS);
  escolha("tipo","tipo",LT_TIPOS);
  texto("capitulo","capítulo da tese","ex.: cap1");
  texto("acesso","onde está o arquivo","ex.: Zotero, Drive, não tenho",true);

  const fdO = el("div","field largo");
  fdO.appendChild(el("label",null,"indicada por — fichas e dossiês"));
  const itens = estado.fichas.map(f => ({ id:f.id, rotulo: numFmt(f) + " " + rotulo(f), detalhe: f.id }))
    .concat((estado.paises||[]).map(p => ({ id:"dossie:" + p.id, rotulo:"Dossiê " + (p.nome || p.id), detalhe:"dossie:" + p.id })));
  // origens que não existem mais continuam marcadas, para não sumirem num salvar
  r.indicadaPor.filter(o => !itens.some(i => i.id === o)).forEach(o => itens.push({ id:o, rotulo:o, detalhe:"não encontrada" }));
  const pk = criarPicker(itens, r.indicadaPor, "nada a marcar");
  fdO.appendChild(pk.elemento); grid.appendChild(fdO);

  const fdM = el("div","field largo");
  fdM.appendChild(el("label",null,"por que ler — aceita **negrito**, *itálico*, [[links]] e listas"));
  const ta = el("textarea"); ta.value = r.motivo || "";
  ta.addEventListener("input", e => { r.motivo = e.target.value; });
  fdM.appendChild(ta); grid.appendChild(fdM);
  art.appendChild(grid);

  salvar.addEventListener("click", () => {
    r.id = paraSlug(r.id) || l.id;
    if (r.id !== l.id && estado.leituras.some(x => x.id === r.id))
      return aviso("Já existe uma leitura com o id " + r.id + ".", "err");
    r.indicadaPor = pk.marcados();
    const i = estado.leituras.findIndex(x => x.id === l.id);
    if (i >= 0) estado.leituras[i] = r;
    editandoLt = null; ltRecemCriada = null; sujo = true; salvarLocal(); renderConteudo();
  });
  cancelar.addEventListener("click", () => {
    if (ltRecemCriada === l.id){
      estado.leituras = estado.leituras.filter(x => x.id !== l.id);
      salvarLocal();
    }
    editandoLt = null; ltRecemCriada = null; renderConteudo();
  });
  apagar.addEventListener("click", () => {
    if (!confirm("Tirar " + ltRotulo(l) + " da lista de leituras? A ficha, se existir, não é afetada.")) return;
    estado.leituras = estado.leituras.filter(x => x.id !== l.id);
    editandoLt = null; ltRecemCriada = null; sujo = true; salvarLocal(); renderConteudo();
  });
  return art;
}

/* Da lista para a ficha: o esqueleto já nasce com autor, ano, título e a
   referência que houver; a leitura vira «lendo» até a ficha existir. */
function criarFichaDeLt(l){
  if (ltFicha(l)) return abrirLeitura(l.id);
  if (!confirm("Criar a pré-ficha " + l.id + " (" + ltRotulo(l) + ")?")) return;
  const a1 = [l.autor, l.titulo, l.onde, l.ano].filter(Boolean).join(". ");
  estado.fichas.push(esqueletoFicha(l.id, l.autor, l.ano, l.titulo, a1 ? a1 + "." : ""));
  l.status = "lendo";
  editando = l.id; sujo = true; salvarLocal();
  irPara("fichas"); render();
  setTimeout(() => { const n = document.getElementById("f-"+l.id); if (n) n.scrollIntoView({block:"start"}); }, 40);
}

/* ==================================================== leitura em tela cheia */
/* Pensada para ficar ao lado do PDF do artigo: uma ficha por vez, sem barra,
   sem filtro, sem matriz. Setas trocam de ficha dentro do que os filtros
   deixaram visível; Esc sai. */

function abrirLeitura(id){
  leitura = id; leituraEdit = false;
  document.body.style.overflow = "hidden";
  renderLeitura();
  $("#leitura").hidden = false;
  $("#leitura").scrollTop = 0;
}
function fecharLeitura(){
  leitura = null; leituraEdit = false;
  $("#leitura").hidden = true;
  document.body.style.overflow = "";
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  renderConteudo();
}
function navegarLeitura(passo){
  const fs = fichasVisiveis();
  const i = fs.findIndex(f => f.id === leitura);
  if (i < 0) return;
  const j = i + passo;
  if (j < 0 || j >= fs.length) return;
  // o modo anotar acompanha: numa sessão de leitura você anota várias fichas
  leitura = fs[j].id;
  renderLeitura();
  $("#leitura").scrollTop = 0;
}

function renderLeitura(){
  const cx = $("#leitura");
  cx.innerHTML = "";
  const f = estado.fichas.find(x => x.id === leitura);
  if (!f) return fecharLeitura();

  const fs = fichasVisiveis();
  const pos = fs.findIndex(x => x.id === leitura);
  cx.style.setProperty("--corpo", (ui.corpo || 17.5) + "px");

  /* --- barra --- */

/* ================================================================ países */

/* Duas relações diferentes, que não podem aparecer como uma só:
   COBREM  — a ficha declara o país em regiao[]: é caso dela.
   MENCIONAM — o país aparece no texto, muitas vezes numa nota minha de
   comparação. Útil de rastrear, péssimo de confundir com cobertura. */
function fichasDoPais(pais){
  const alvos = (pais.aliases && pais.aliases.length ? pais.aliases : [pais.nome])
                  .map(a => a.toLowerCase()).filter(Boolean);
  const cobrem = [], mencionam = [];
  estado.fichas.forEach(f => {
    if (lista(f,"regiao").includes(pais.id)) return cobrem.push(f);
    if (pais.id === "outros") return;
    const texto = (f.secoes||[]).map(s => s.corpo).join(" ").toLowerCase();
    if (alvos.some(a => texto.includes(a))) mencionam.push(f);
  });
  return { cobrem, mencionam };
}
