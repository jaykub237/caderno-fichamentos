/* =============================================================== análise */
/* mesma lógica do Invoke-Caderno.ps1, recalculada a cada edição */

function analise(fs){
  const ids = fs.map(f => f.id);

  // 1. panorama
  const panorama = {};
  Object.keys(EIXOS).forEach(chave => {
    const mapa = {};
    fs.forEach(f => {
      const vals = lista(f,chave).length ? lista(f,chave) : [campo(f,chave) || "—"];
      vals.forEach(v => { (mapa[v] = mapa[v] || []).push(f.id); });
    });
    panorama[chave] = mapa;
  });

  // 2. co-citação
  const refs = {};
  fs.forEach(f => lista(f,"refs").forEach(r => { (refs[r] = refs[r] || []).push(f.id); }));

  // 3. pares
  const EIXOS_PAR = ["processo","criterio","posicao","nivel","metodo","campo"];
  const pares = [];
  for (let a=0; a<fs.length; a++) for (let b=a+1; b<fs.length; b++){
    const fa=fs[a], fb=fs[b];
    const ra=lista(fa,"refs"), rb=lista(fb,"refs");
    const comuns = ra.filter(r => rb.includes(r));
    // co-citação não vê "A cita B": é a relação mais forte que existe entre
    // duas fichas e some se ninguém procurar por ela
    const cita = [];
    if (ra.includes(fb.id)) cita.push({ de:fa.id, para:fb.id });
    if (rb.includes(fa.id)) cita.push({ de:fb.id, para:fa.id });
    const divergem=[], convergem=[];
    EIXOS_PAR.forEach(k => {
      const va=campo(fa,k), vb=campo(fb,k);
      if (va === vb) convergem.push(k);
      else divergem.push({ eixo:k, a:va||"—", b:vb||"—", decisivo:(k==="processo"||k==="criterio") });
    });
    let veredito=null, classe="";
    const temDecisivo = divergem.some(d => d.decisivo);
    if (cita.length){
      veredito = cita.length === 2
        ? "diálogo direto — uma cita a outra nos dois sentidos"
        : "linhagem — " + cita[0].de + " cita " + cita[0].para + "; ler as duas em sequência";
      classe = "v-cita";
    }
    else if (comuns.length>=3 && divergem.length>=3){ veredito="tensão — mesma literatura, leituras opostas"; classe="v-tensao"; }
    else if (comuns.length>=3 && divergem.length<=2){
      if (temDecisivo){ veredito="padrão com falha — a única diferença está num eixo decisivo"; classe="v-tensao"; }
      else { veredito="padrão — usar como bloco"; classe="v-padrao"; }
    }
    else if (comuns.length<=1 && convergem.length>=3){ veredito="convergência independente — mesmo lugar por caminhos separados"; classe="v-indep"; }
    pares.push({ a:fa, b:fb, comuns, cita, divergem, convergem, veredito, classe });
  }
  pares.sort((x,y) => y.comuns.length - x.comuns.length);

  // 4. cruzamentos
  function cruzar(ex, ey){
    const vx=[], vy=[], celulas={};
    fs.forEach(f => {
      const xs = lista(f,ex).length ? lista(f,ex) : [campo(f,ex)||"—"];
      const ys = lista(f,ey).length ? lista(f,ey) : [campo(f,ey)||"—"];
      xs.forEach(x => { if(!vx.includes(x)) vx.push(x);
        ys.forEach(y => { if(!vy.includes(y)) vy.push(y);
          (celulas[x+"|"+y] = celulas[x+"|"+y] || []).push(f.id); }); });
    });
    return { ex, ey, vx:vx.sort(), vy:vy.sort(), celulas };
  }
  const cruzamentos = [cruzar("nivel","processo"), cruzar("metodo","nivel"), cruzar("processo","criterio")];

  // 5. rede
  const rede=[];
  fs.forEach(f => {
    const texto = (f.secoes||[]).map(s=>s.corpo).join("\n");
    const vistos = new Set();
    (texto.match(/\[\[([^\]]+)\]\]/g)||[]).forEach(m => {
      const alvo = m.slice(2,-2).trim();
      if (alvo === f.id || vistos.has(alvo)) return;
      vistos.add(alvo);
      rede.push({ de:f.id, para:alvo, existe: ids.includes(alvo) });
    });
  });
  const orfas = fs.filter(f => !rede.some(l => l.de===f.id || l.para===f.id)).map(f=>f.id);

  // 6. pendências
  const pend = fs.map(f => ({ id:f.id, status:campo(f,"status"), campos:pendentes(f) }))
                 .filter(x => x.campos.length);

  return { panorama, refs, pares, cruzamentos, rede, orfas, pend, total:fs.length, ids };
}

function renderAnalise(){
  const pane = $("#pane-analise");
  pane.innerHTML = "";
  const fs = fichasVisiveis();
  if (fs.length < 2){
    const d = el("div","empty-state");
    d.appendChild(el("h3",null,"A análise precisa de pelo menos duas fichas"));
    d.appendChild(el("p",null,"Afrouxe os filtros. Comparar é uma operação entre pares."));
    return pane.appendChild(d);
  }
  const A = analise(fs);

  pane.appendChild(el("h2","sec","Análise comparada"));
  pane.appendChild(el("p","hint",
    "Recalculada a cada edição, sobre as " + A.total + " fichas visíveis. Ela cruza o que você classificou — não lê os artigos. Vocabulário inconsistente produz falsas distinções."));

  // panorama + espinha
  const g = el("div","grid2");

  const c1 = el("div");
  c1.appendChild(el("h3",null,"Panorama por eixo"));
  Object.keys(EIXOS).forEach(chave => {
    const mapa = A.panorama[chave];
    const vals = Object.keys(mapa).sort();
    if (vals.length === 0) return;
    c1.appendChild(el("h4",null,EIXOS[chave]));
    const ul = el("ul","lista");
    vals.forEach(v => {
      const li = el("li");
      li.innerHTML = "<code>"+esc(v)+"</code> ("+mapa[v].length+"): "+esc(mapa[v].join(", "));
      if (mapa[v].length === 1) li.innerHTML += ' <span class="tag-iso">← isolada</span>';
      if (mapa[v].length === A.total && A.total > 1) li.innerHTML += ' <span class="tag-uni">← unânime</span>';
      ul.appendChild(li);
    });
    c1.appendChild(ul);
  });
  g.appendChild(c1);

  const c2 = el("div");
  c2.appendChild(el("h3",null,"Espinha bibliográfica"));
  const entradas = Object.entries(A.refs).sort((a,b)=>b[1].length-a[1].length);
  const compart = entradas.filter(e => e[1].length >= 2);
  if (!compart.length){
    c2.appendChild(el("p","hint","Nenhuma referência partilhada. Preencha o campo refs das fichas — é ele que revela parentesco intelectual."));
  } else {
    const ul = el("ul","lista");
    compart.forEach(([ref, quem]) => {
      const ausentes = A.ids.filter(i => !quem.includes(i));
      const li = el("li");
      li.innerHTML = "<b>"+esc(ref)+"</b> — "+quem.length+"/"+A.total+": "+esc(quem.join(", "));
      if (ausentes.length && ausentes.length <= 2){
        li.innerHTML += ' <span class="tag-iso">ausente em '+esc(ausentes.join(", "))+'</span>';
      }
      ul.appendChild(li);
    });
    c2.appendChild(ul);
  }
  const solo = entradas.filter(e => e[1].length === 1).map(e => e[0]);
  if (solo.length){
    c2.appendChild(el("h4",null,"De uma ficha só"));
    const p = el("p"); p.style.fontSize="14px"; p.style.color="var(--ink-soft)";
    p.innerHTML = solo.map(s => "<code>"+esc(s)+"</code>").join(" ");
    c2.appendChild(p);
  }
  g.appendChild(c2);
  pane.appendChild(g);

  // pares
  const parCard = cardDobravel("Pares — onde comparar", "pares");
  const cp = parCard.corpo; parCard.card.style.marginTop="18px";
  A.pares.forEach(p => {
    const d = el("div","par");
    d.innerHTML = "<b>"+esc(p.a.id)+" × "+esc(p.b.id)+"</b>";
    const ul = el("ul","lista"); ul.style.marginTop="6px";
    const li1 = el("li");
    li1.innerHTML = p.comuns.length
      ? "Referências em comum ("+p.comuns.length+"): " + p.comuns.map(r=>"<code>"+esc(r)+"</code>").join(" ")
      : "Nenhuma referência em comum — se os temas se tocam, isso já é um achado.";
    ul.appendChild(li1);
    p.cita.forEach(c => {
      const li = el("li");
      li.innerHTML = "<b>"+esc(c.de)+"</b> cita <b>"+esc(c.para)+"</b> diretamente";
      ul.appendChild(li);
    });
    if (p.convergem.length) ul.appendChild(el("li",null,"Convergem em: "+p.convergem.join(", ")));
    p.divergem.forEach(dv => {
      const li = el("li");
      li.innerHTML = "Divergem em <b>"+esc(dv.eixo)+"</b>: "+esc(dv.a)+" / "+esc(dv.b) +
        (dv.decisivo ? ' <span class="tag-iso">eixo decisivo</span>' : "");
      ul.appendChild(li);
    });
    d.appendChild(ul);
    if (p.veredito){
      const v = el("span","verdict "+p.classe, p.veredito);
      d.appendChild(v);
    }
    cp.appendChild(d);
  });
  pane.appendChild(parCard.card);

  // cruzamentos
  const cruzCard = cardDobravel("Cruzamentos — a célula vazia é a lacuna", "cruzamentos");
  const cc = cruzCard.corpo;
  A.cruzamentos.forEach(c => {
    cc.appendChild(el("h4",null,(EIXOS[c.ex]||c.ex)+" × "+(EIXOS[c.ey]||c.ey)));
    const sc = el("div"); sc.style.overflowX="auto";
    const t = el("table","cross");
    const thead=el("thead"), trh=el("tr");
    trh.appendChild(el("th",null,""));
    c.vy.forEach(y => trh.appendChild(el("th",null,y)));
    thead.appendChild(trh); t.appendChild(thead);
    const tb=el("tbody");
    c.vx.forEach(x => {
      const tr=el("tr"); tr.appendChild(el("th",null,x));
      c.vy.forEach(y => {
        const quem = c.celulas[x+"|"+y];
        tr.appendChild(quem ? el("td",null,quem.join(" ")) : el("td","empty","vazio"));
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb); sc.appendChild(t); cc.appendChild(sc);
  });
  pane.appendChild(cruzCard.card);

  // rede + pendências
  const g2 = el("div","grid2");
  const r1 = el("div");
  r1.appendChild(el("h3",null,"Rede de diálogo (D6)"));
  if (!A.rede.length){
    r1.appendChild(el("p","hint","Nenhum [[link]] entre fichas. O caderno ainda é uma pilha, não uma rede."));
  } else {
    const ul = el("ul","lista");
    A.rede.forEach(l => {
      const reciproco = A.rede.some(o => o.de===l.para && o.para===l.de);
      const li = el("li", null, l.de + (reciproco ? " ↔ " : " → ") + l.para);
      if (!l.existe) li.innerHTML += ' <span class="tag-iso">ficha inexistente</span>';
      ul.appendChild(li);
    });
    r1.appendChild(ul);
  }
  if (A.orfas.length){
    const p = el("p","hint"); p.style.marginTop="12px";
    p.innerHTML = "<strong>Órfãs</strong> (ninguém cita, não citam ninguém): " + esc(A.orfas.join(", ")) + ". Preencher o D6 delas.";
    r1.appendChild(p);
  }
  g2.appendChild(r1);

  const r2 = el("div");
  r2.appendChild(el("h3",null,"Pendências"));
  if (!A.pend.length){
    r2.appendChild(el("p","hint","Nenhuma. Todas as fichas visíveis estão completas."));
  } else {
    const ul = el("ul","lista");
    A.pend.forEach(x => {
      const li = el("li");
      li.innerHTML = "<b>"+esc(x.id)+"</b> ("+esc(x.status)+") — faltam: "+esc(x.campos.join(", "));
      ul.appendChild(li);
    });
    r2.appendChild(ul);
  }
  g2.appendChild(r2);
  pane.appendChild(g2);
}

/* ================================================================ modais */

function fecharModal(){ $("#modal").hidden = true; }
function abrirModal(construir){
  const box = $("#modalBox");
  box.innerHTML = "";
  construir(box);
  $("#modal").hidden = false;
}
function aviso(texto, tipo){
  const box = $("#modalBox");
  if (!$("#modal").hidden && box){
    const antigo = box.querySelector(".msg"); if (antigo) antigo.remove();
    box.appendChild(el("div","msg "+(tipo||"ok"), texto));
    return;
  }
  abrirModal(b => {
    b.appendChild(el("h3",null, tipo==="err" ? "Não deu" : "Pronto"));
    b.appendChild(el("p",null,texto));
    const a = el("div","modal-actions");
    const ok = el("button","btn solid","Fechar"); ok.addEventListener("click", fecharModal);
    a.appendChild(ok); b.appendChild(a);
  });
}

function abrirConfig(nota){
  abrirModal(b => {
    b.appendChild(el("h3",null,"Sincronia"));
    b.appendChild(el("p",null,
      "As fichas ficam num Gist secreto. O ID e o token moram só neste navegador, em chave separada dos dados — não entram no backup nem no repositório."));
    if (nota) b.appendChild(el("div","msg warn",nota));

    const f1 = el("div","field");
    f1.appendChild(el("label",null,"ID do Gist"));
    const i1 = el("input"); i1.value = cfg.gist; i1.placeholder="ex.: 7f3c9a1b2d4e…"; f1.appendChild(i1);
    b.appendChild(f1);

    const f2 = el("div","field");
    f2.appendChild(el("label",null,"Token (fine-grained PAT, permissão Gists: read and write)"));
    const i2 = el("input"); i2.type="password"; i2.value = cfg.token; i2.placeholder="github_pat_…"; f2.appendChild(i2);
    b.appendChild(f2);

    const a = el("div","modal-actions");
    const sv = el("button","btn solid","Salvar");
    sv.addEventListener("click", () => {
      cfg.gist = i1.value.trim(); cfg.token = i2.value.trim();
      salvarCfg(); pintarSync(); fecharModal();
    });
    const imp = el("button","btn quiet","Importar caderno.json");
    imp.addEventListener("click", abrirImportar);
    const exp = el("button","btn quiet","Baixar backup");
    exp.addEventListener("click", baixarBackup);
    const fe = el("button","btn quiet","Fechar"); fe.addEventListener("click", fecharModal);
    a.appendChild(sv); a.appendChild(imp); a.appendChild(exp);
    const sp = el("span","spacer"); a.appendChild(sp); a.appendChild(fe);
    b.appendChild(a);
  });
}

function abrirImportar(){
  abrirModal(b => {
    b.appendChild(el("h3",null,"Importar"));
    b.appendChild(el("p",null,
      "Aceita o caderno.json inteiro (substitui tudo) ou uma ficha avulsa em JSON (acrescenta, ou atualiza se o id já existir). É por aqui que entram as pré-fichas geradas fora do navegador."));

    const arqf = el("div","field");
    arqf.appendChild(el("label",null,"Arquivo"));
    const inp = el("input"); inp.type="file"; inp.accept=".json,application/json";
    arqf.appendChild(inp); b.appendChild(arqf);

    const ta = el("textarea"); ta.placeholder = "…ou cole o JSON aqui";
    b.appendChild(ta);

    inp.addEventListener("change", () => {
      const file = inp.files && inp.files[0]; if (!file) return;
      const fr = new FileReader();
      fr.onload = () => { ta.value = fr.result; };
      fr.readAsText(file, "utf-8");
    });

    const a = el("div","modal-actions");
    const ok = el("button","btn solid","Importar");
    ok.addEventListener("click", () => {
      let dados;
      try { dados = JSON.parse(ta.value); }
      catch(e){ return aviso("JSON inválido: " + e.message, "err"); }
      try { aplicarImport(dados); }
      catch(e){ return aviso(e.message, "err"); }
    });
    const fe = el("button","btn quiet","Cancelar"); fe.addEventListener("click", fecharModal);
    a.appendChild(ok); const sp=el("span","spacer"); a.appendChild(sp); a.appendChild(fe);
    b.appendChild(a);
  });
}

function aplicarImport(dados){
  if (Array.isArray(dados.fichas)){
    if (estado.fichas.length && !confirm("Isso substitui as " + estado.fichas.length + " fichas locais. Continuar?")) return;
    // preserva dossiês e autores se o arquivo importado não os trouxer
    const paisesAntigos = estado.paises, autoresAntigos = estado.autores, leiturasAntigas = estado.leituras;
    estado = { schema:1, savedAt:dados.savedAt||null, fichas:dados.fichas,
               titulo: dados.titulo || estado.titulo,
               vocab: dados.vocab || estado.vocab,
               paises: Array.isArray(dados.paises) && dados.paises.length ? dados.paises : paisesAntigos,
               autores: Array.isArray(dados.autores) && dados.autores.length ? dados.autores : autoresAntigos,
               leituras: Array.isArray(dados.leituras) && dados.leituras.length ? dados.leituras : leiturasAntigas };
    normalizar();
    sujo = true; salvarLocal(); render();
    return aviso("Importadas " + estado.fichas.length + " fichas. Clique em Enviar para gravar no gist.", "ok");
  }
  const ficha = Array.isArray(dados) ? null : dados;
  if (!ficha || !ficha.id) throw new Error("Não reconheci o formato. Esperava um objeto com fichas[] ou uma ficha com id.");
  if (!Array.isArray(ficha.secoes)) ficha.secoes = [];
  const i = estado.fichas.findIndex(x => x.id === ficha.id);
  ficha.meta = ficha.meta || {};
  if (i >= 0){
    if (!confirm("Já existe uma ficha " + ficha.id + ". Substituir?")) return;
    // substituir não é entrar de novo: o número continua o da ficha antiga
    if (numero(estado.fichas[i])) ficha.meta.n = numero(estado.fichas[i]);
    estado.fichas[i] = ficha;
  } else {
    if (!numero(ficha)) ficha.meta.n = proximoNumero();
    estado.fichas.push(ficha);
  }
  sujo = true; salvarLocal(); render();
  aviso("Ficha " + ficha.id + " no caderno. Clique em Enviar para gravar no gist.", "ok");
}

function baixarBackup(){
  const blob = new Blob([JSON.stringify(estado, null, 2)], {type:"application/json"});
  const a = el("a");
  a.href = URL.createObjectURL(blob);
  a.download = "caderno-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function esqueletoFicha(id, autor, ano, titulo, a1){
  return {
    id,
    meta:{ id, n:proximoNumero(), autor:autor||"", ano:ano||"", titulo:titulo||"",
           status:"pre-ficha", regiao:[], refs:[], tags:[], filiacao:[] },
    secoes: SECOES_PADRAO.map(([codigo,tit]) => ({
      codigo, titulo:tit,
      corpo: codigo === "A1" ? (a1||"") : "> A preencher após a leitura."
    }))
  };
}

function novaFicha(){
  abrirModal(b => {
    b.appendChild(el("h3",null,"Ficha nova"));
    b.appendChild(el("p",null,"Cria o esqueleto com os 22 campos. O bloco D nasce marcado como pendente."));
    const f1 = el("div","field");
    f1.appendChild(el("label",null,"id — formato autorAAAA, é a chave dos [[links]]"));
    const i1 = el("input"); i1.placeholder="ex.: mcdonald2013"; f1.appendChild(i1); b.appendChild(f1);
    const f2 = el("div","field");
    f2.appendChild(el("label",null,"autor")); const i2 = el("input"); f2.appendChild(i2); b.appendChild(f2);
    const f3 = el("div","field");
    f3.appendChild(el("label",null,"ano")); const i3 = el("input"); f3.appendChild(i3); b.appendChild(f3);
    const f4 = el("div","field");
    f4.appendChild(el("label",null,"título")); const i4 = el("input"); f4.appendChild(i4); b.appendChild(f4);

    const a = el("div","modal-actions");
    const ok = el("button","btn solid","Criar");
    ok.addEventListener("click", () => {
      const id = i1.value.trim();
      if (!id) return aviso("O id é obrigatório — sem ele os [[links]] não funcionam.", "err");
      if (estado.fichas.some(x => x.id === id)) return aviso("Já existe uma ficha com esse id.", "err");
      estado.fichas.push(esqueletoFicha(id, i2.value.trim(), i3.value.trim(), i4.value.trim()));
      sujo = true; editando = id; salvarLocal(); fecharModal(); irPara("fichas"); render();
    });
    const fe = el("button","btn quiet","Cancelar"); fe.addEventListener("click", fecharModal);
    a.appendChild(ok); const sp=el("span","spacer"); a.appendChild(sp); a.appendChild(fe);
    b.appendChild(a);
  });
}

/* =============================================================== render */

const ABAS = ["matriz","fichas","paises","autores","leituras","analise"];

function irPara(nome){
  const antes = aba;
  aba = nome;
  ABAS.forEach(n => {
    $("#tab-"+n).setAttribute("aria-selected", n===nome ? "true" : "false");
    $("#pane-"+n).hidden = (n !== nome);
  });
  // a barra de filtros muda de forma só quando se entra ou se sai das leituras
  if ((antes === "leituras") !== (nome === "leituras")) renderFiltros();
  renderConteudo();
}
function renderConteudo(){
  if (aba === "matriz") renderMatriz();
  else if (aba === "fichas") renderFichas();
  else if (aba === "paises") renderPaises();
  else if (aba === "autores") renderAutores();
  else if (aba === "leituras") renderLeituras();
  else renderAnalise();
}
function render(){
  // o tema da tese também é conteúdo: sai do Gist, não fica no HTML público
  $("#subtitulo").textContent = estado.titulo || (estado.fichas.length ? "" : "sem dados carregados");
  renderFiltros(); renderConteudo(); pintarSync();
}

/* ================================================================ start */

document.addEventListener("click", e => {
  const jump = e.target.closest("[data-jump]");
  if (jump){
    e.preventDefault();
    const id = jump.getAttribute("data-jump");
    if (!estado.fichas.some(f => f.id === id)) return aviso("Ainda não existe uma ficha " + id + ".", "warn");
    irPara("fichas");
    setTimeout(() => { const n = document.getElementById("f-"+id); if (n) n.scrollIntoView({block:"start"}); }, 30);
  }
  if (e.target === $("#modal")) fecharModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    if (!$("#leitura").hidden) return fecharLeitura();
    if (!$("#indice").hidden) return fecharIndice();
    return fecharModal();
  }
  if ($("#leitura").hidden) return;
  // dentro de um textarea as setas pertencem ao cursor, não à navegação
  const digitando = /^(TEXTAREA|INPUT)$/.test((e.target.tagName || ""));
  if (digitando) return;
  if (e.key === "ArrowLeft")  { e.preventDefault(); navegarLeitura(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); navegarLeitura(1); }
});

ABAS.forEach(n => $("#tab-"+n).addEventListener("click", ()=>irPara(n)));
$("#btnIndice").addEventListener("click", abrirIndice);
$("#backdrop").addEventListener("click", fecharIndice);
$("#btnBuscar").addEventListener("click", ()=>buscar());
$("#btnEnviar").addEventListener("click", enviar);
$("#btnNova").addEventListener("click", novaFicha);
$("#btnCfg").addEventListener("click", ()=>abrirConfig());
window.addEventListener("beforeunload", e => { if (sujo){ e.preventDefault(); e.returnValue = ""; } });

carregarLocal();
render();
if (cfg.gist && cfg.token && !estado.fichas.length) buscar({silencioso:true});
</script>
